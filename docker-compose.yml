services:
  postgres:
    image: postgres:16-alpine
    container_name: shop-postgres
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Test/tooling runtime, not started by `docker compose up`. Used by `make race`:
  #   docker compose run --rm runner bash tests/race.sh
  runner:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      APP_URL: http://127.0.0.1:8000
      SUPPLIER_A_URL: http://127.0.0.1:9001
      SUPPLIER_B_URL: http://127.0.0.1:9002
    volumes:
      - .:/app
    working_dir: /app

volumes:
  pgdata:
